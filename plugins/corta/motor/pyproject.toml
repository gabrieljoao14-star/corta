[project]
name = "corta"
version = "0.4.0"
description = "Motor de edição de vídeo do /corta: silêncio, takes, legenda e verificação. Roda no Mac e no Windows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pillow>=10.3",
    "psutil>=5.9",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# limpeza de voz "forte" (IA). Pesada: só instala quando a pessoa escolhe.
forte = ["demucs>=4.0.1", "torch>=2.2", "torchaudio>=2.2"]

[project.scripts]
corta = "corta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corta"]

[dependency-groups]
dev = ["pytest>=8"]
